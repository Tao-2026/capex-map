<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Global CapEx Flow Map</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- Load the Mapbox Engine -->
<link href="https://mapbox.com" rel="stylesheet">
<script src="https://mapbox.com"></script>
<style>
body { margin: 0; padding: 0; background-color: #0b0f19; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="map"></div>

<script>
// Get a free public token at mapbox.com to replace this placeholder
mapboxgl.accessToken = 'pk.eyJ1IjoiY2FwZXh0cmFja2VyIiwiYSI6ImNsM3g0ZHkwdDAwY3MzY212bDJ3dW03ZTMifQ.mG5N9-6e_6hE-W8H_O0Hkg';

// Simulated database data directly inside the file for easy workflow testing
const sampleCapexData = [
    { source: [-74.0060, 40.7128], target: [139.6503, 35.6762], weight: 12 }, // New York to Tokyo ($12B)
    { source: [2.3522, 48.8566], target: [103.8198, 1.3521], weight: 8 },    // Paris to Singapore ($8B)
    { source: [-0.1278, 51.5074], target: [-43.1729, -22.9068], weight: 5 }   // London to Rio ($5B)
];

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11', // Futuristic dark background
    center:,
    zoom: 1.5,
    pitch: 45 // 3D tilted horizon angle
});

map.on('load', () => {
    renderFlowLines(sampleCapexData);
});

function renderFlowLines(projects) {
    projects.forEach((project, index) => {
        const routeId = `route-${index}`;
        
        // Calculate curve height dynamically based on distance to simulate global current arcs
        const midpoint = [
            (project.source[0] + project.target[0]) / 2,
            (project.source[1] + project.target[1]) / 2 + (Math.abs(project.source[0] - project.target[0]) * 0.15)
        ];

        const geojson = {
            'type': 'Feature',
            'properties': {},
            'geometry': {
                'type': 'LineString',
                'coordinates': [project.source, midpoint, project.target]
            }
        };

        // Render the fluid flow line paths onto the canvas
        map.addSource(routeId, { 'type': 'geojson', 'data': geojson });
        map.addLayer({
            'id': routeId,
            'type': 'line',
            'source': routeId,
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': {
                'line-color': '#00ffcc', // Glowing cyan currents
                'line-width': Math.max(2, Math.min(project.weight * 0.8, 12)), // Thickness scales with project cost
                'line-opacity': 0.75
            }
        });
    });
}
</script>
</body>
</html>
